<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#080808;color:#f4f4f4;font-family:Arial,sans-serif;padding:32px 16px">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:auto;background:#111;border:1px solid #292929;border-radius:16px;overflow:hidden">
      <tr>
        <td style="padding:32px 30px 22px">
          <img
            src="https://usefio.vercel.app/FIOlogo%2Bnome/Branco.png"

            alt="FIO"
            style="display:block;max-width:92px;height:auto;border:0"
          />

      </tr>

      <tr><td style="padding:0 30px 8px;font-size:12px;letter-spacing:2px;color:#999">RECUPERAÇÃO DE ACESSO</td></tr>

      <tr><td style="padding:0 30px 30px;color:#777;font-size:12px;line-height:1.6">Se você não solicitou uma nova senha, ignore esta mensagem e não compartilhe o link com ninguém.</td></tr>
