project_id = "fio-saas-v2"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
[db]
port = 54322
major_version = 17
[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/reset-password", "http://localhost:5173/confirm-email"]
enable_signup = true
[auth.email]
enable_signup = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirme seu e-mail no FIO"
content_path = "./supabase/email-templates/confirmation.html"

[auth.email.template.recovery]
subject = "Redefina sua senha do FIO"
content_path = "./supabase/email-templates/recovery.html"
